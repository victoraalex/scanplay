<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f6f7f9">
    <title>ScanPlay</title>
    <link rel="stylesheet" href="assets/css/styles.css">
    <script defer src="assets/js/app.js"></script>
  </head>
  <body>
    <div class="app">
      <main class="home-view" id="homeView" aria-labelledby="homeTitle">
        <div class="screen-shell">
          <header class="home-header">
            <p class="brand">ScanPlay</p>
            <h1 id="homeTitle">ScanPlay</h1>
            <p class="tagline">Entrena para mirar antes de actuar.</p>
          </header>

          <section class="exercise-library" aria-label="Biblioteca de ejercicios">
            <div class="exercise-grid" id="exerciseCards"></div>
          </section>
        </div>
      </main>

      <main class="config-view" id="configView" aria-labelledby="exerciseTitle" hidden>
        <div class="screen-shell config-shell">
          <button class="nav-back" id="backToExercisesButton" type="button">← Ejercicios</button>

          <header class="exercise-header">
            <p class="brand" id="exerciseKicker">Ejercicio</p>
            <h1 id="exerciseTitle"></h1>
            <p class="exercise-description" id="exerciseDescription"></p>
          </header>

          <section class="exercise-meta" id="exerciseMeta" aria-label="Objetivo y material">
            <div class="meta-item">
              <span class="meta-label">Objetivo</span>
              <p id="exerciseObjective"></p>
            </div>
            <div class="meta-item">
              <span class="meta-label">Material</span>
              <p id="exerciseEquipment"></p>
            </div>
          </section>

          <section class="info-section" id="setupSection" aria-labelledby="setupTitle" hidden>
            <h2 id="setupTitle">Cómo montarlo</h2>
            <p id="setupText"></p>
          </section>

          <section class="info-section" id="instructionsSection" aria-labelledby="instructionsTitle" hidden>
            <h2 id="instructionsTitle">Instrucciones</h2>
            <p id="instructionsText"></p>
          </section>

          <section class="control-section" aria-labelledby="configTitle">
            <h2 id="configTitle">Configuración</h2>
            <div class="config-controls" id="configControls"></div>
          </section>

          <p class="validation-message" id="validationMessage" role="status" aria-live="polite"></p>

          <button class="play-button" id="startButton" type="button">▶ EMPEZAR</button>
        </div>
      </main>

      <section class="training-view" id="trainingView" aria-label="Entrenamiento" hidden>
        <button class="back-button" id="backButton" type="button">← Volver</button>
        <div class="stimulus-root" id="stimulusRoot" aria-live="off"></div>
      </section>
    </div>
  </body>
</html>
