<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0a0a0b">
    <title>ScanPlay</title>
    <link rel="stylesheet" href="assets/css/styles.css">
    <script defer src="assets/js/app.js"></script>
  </head>
  <body>
    <div class="app">
      <main class="home-view" id="homeView" aria-labelledby="homeTitle">
        <div class="screen-shell">
          <header class="home-header">
            <p class="brand">ScanPlay</p>
            <h1 id="homeTitle">Entrena tu visión</h1>
            <p class="tagline">Estímulos visuales para trabajar el escaneo con balón.</p>
          </header>

          <section class="mode-library" aria-label="Modos de entrenamiento">
            <div class="mode-grid" id="modeCards"></div>
          </section>
        </div>
      </main>

      <main class="config-view" id="configView" aria-labelledby="modeTitle" hidden>
        <div class="screen-shell config-shell">
          <button class="nav-back" id="backToHomeButton" type="button">← Volver</button>

          <header class="mode-header">
            <p class="brand" id="modeKicker">Configuración</p>
            <h1 id="modeTitle"></h1>
            <p class="mode-description" id="modeDescription"></p>
          </header>

          <section class="control-section" aria-labelledby="configTitle">
            <h2 id="configTitle">Ajustes</h2>
            <div class="config-controls" id="configControls"></div>
          </section>

          <p class="validation-message" id="validationMessage" role="status" aria-live="polite"></p>

          <button class="play-button" id="startButton" type="button">INICIAR SESIÓN</button>
        </div>
      </main>

      <section class="training-view" id="trainingView" aria-label="Entrenamiento" hidden>
        <button class="back-button" id="backButton" type="button">← Salir</button>
        <div class="stimulus-root" id="stimulusRoot" aria-live="off"></div>
      </section>
    </div>
  </body>
</html>
