<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f6f7f9">
    <title>ScanPlay</title>
    <link rel="stylesheet" href="assets/css/styles.css">
    <script defer src="assets/js/app.js"></script>
  </head>
  <body>
    <div class="app">
      <main class="menu-view" id="menuView" aria-labelledby="appTitle">
        <div class="menu-shell">
          <header class="menu-header">
            <p class="brand">ScanPlay</p>
            <h1 id="appTitle">Escaneo visual</h1>
          </header>

          <section class="control-section" aria-labelledby="modeTitle">
            <h2 id="modeTitle">Estímulo</h2>
            <div class="mode-switch" id="modeOptions" role="group" aria-label="Tipo de estímulo">
              <button class="mode-button" type="button" data-mode="color">Colores</button>
              <button class="mode-button" type="button" data-mode="number">Números</button>
            </div>
          </section>

          <section class="control-section" id="colorSection" aria-labelledby="colorsTitle">
            <div class="section-line">
              <h2 id="colorsTitle">Colores</h2>
              <span class="selection-count" id="colorCount" aria-live="polite"></span>
            </div>
            <div class="color-grid" id="colorOptions"></div>
          </section>

          <section class="control-section" id="numberSection" aria-labelledby="numbersTitle" hidden>
            <h2 id="numbersTitle">Rango</h2>
            <div class="number-range">
              <label class="number-field">
                <span>Desde</span>
                <input id="numberFrom" type="number" inputmode="numeric" min="0" max="99" step="1" value="1">
              </label>
              <label class="number-field">
                <span>Hasta</span>
                <input id="numberTo" type="number" inputmode="numeric" min="0" max="99" step="1" value="10">
              </label>
            </div>
          </section>

          <section class="control-section" aria-labelledby="secondsTitle">
            <h2 id="secondsTitle">Segundos</h2>
            <div class="option-grid" id="intervalOptions"></div>
          </section>

          <section class="control-section" aria-labelledby="timeTitle">
            <h2 id="timeTitle">Tiempo</h2>
            <div class="option-grid" id="durationOptions"></div>
          </section>

          <p class="validation-message" id="validationMessage" role="status" aria-live="polite"></p>

          <button class="play-button" id="playButton" type="button">▶ PLAY</button>
        </div>
      </main>

      <section class="training-view" id="trainingView" aria-label="Entrenamiento" hidden>
        <button class="back-button" id="backButton" type="button">← Volver</button>
        <div class="number-stimulus" id="numberStimulus" aria-live="off" hidden></div>
      </section>
    </div>
  </body>
</html>
